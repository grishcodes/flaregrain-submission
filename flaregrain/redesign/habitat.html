<main class="sub" id="main" tabindex="-1">
  <header class="sub-head">
    <h1><span class="mono">(Habitat)</span>Habitat atmosphere</h1>
    <p>Pick an atmosphere. Flaregrain shows which NASA PSI rows tested near it, what they found, and where nothing was tested. It never interpolates.</p>
  </header>
  <div class="hab-presets" id="hab-presets" role="group" aria-label="Atmosphere presets"></div>
  <form class="hab-controls" id="hab-form">
    <label><span class="mono">Oxygen</span><input id="hab-o2" type="range" min="10" max="50" step="0.5"><output id="hab-o2-out"></output></label>
    <label><span class="mono">Pressure</span><input id="hab-psi" type="range" min="2" max="30" step="0.1"><output id="hab-psi-out"></output></label>
    <label class="pick"><span class="mono">Gravity</span><select id="hab-g"><option value="micro">Microgravity</option><option value="moon">Moon, 0.16 g</option><option value="mars">Mars, 0.38 g</option><option value="earth">Earth, 1 g</option></select></label>
  </form>
  <p class="cmp-status mono" id="hab-status" role="status" aria-live="polite"></p>
  <div class="hab-layout"><figure class="hab-chart" id="hab-chart"></figure><div class="hab-read" id="hab-read"></div></div>
</main>
